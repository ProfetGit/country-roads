modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"

[[mods]]
modId = "countryroads"
version = "${version}"
displayName = "${name}"
authors = "${author}"
displayURL = "${homepage}"
logoFile = "assets/countryroads/icon.png"
logoBlur = false
description = '''${description}'''
displayTest = "MATCH_VERSION"

[[mixins]]
config = "countryroads.mixins.json"

[[mixins]]
config = "countryroads.chunkdata.mixins.json"

[[dependencies.countryroads]]
modId = "minecraft"
type = "required"
versionRange = "[${mc},${mc_next})"
ordering = "NONE"
side = "BOTH"
